# Alacritty: a lightweight terminal for nvim, in nvim's own colors (catppuccin latte). scripts/setup.lua
# installs this as alacritty.toml in Alacritty's config folder (%APPDATA%\alacritty on Windows,
# ~/.config/alacritty on Linux), with windows.toml appended on Windows.

[window]
dimensions = { columns = 120, lines = 30 }
padding = { x = 6, y = 4 }
dynamic_padding = true

[scrolling]
history = 5000

[font]
size = 11.0
normal = { family = "Iosevka Nerd Font", style = "SemiBold" }
bold = { family = "Iosevka Nerd Font", style = "Bold" }
italic = { family = "Iosevka Nerd Font", style = "SemiBold Italic" }
bold_italic = { family = "Iosevka Nerd Font", style = "Bold Italic" }

# catppuccin latte, from catppuccin's own Alacritty theme (github.com/catppuccin/alacritty), so the
# shell and the space around nvim match nvim; the selection is nvim's Visual color
[colors.primary]
background = "#eff1f5"
foreground = "#4c4f69"
dim_foreground = "#8c8fa1"
bright_foreground = "#4c4f69"

[colors.cursor]
text = "#eff1f5"
cursor = "#dc8a78"

[colors.vi_mode_cursor]
text = "#eff1f5"
cursor = "#7287fd"

[colors.search.matches]
foreground = "#eff1f5"
background = "#6c6f85"

[colors.search.focused_match]
foreground = "#eff1f5"
background = "#40a02b"

[colors.footer_bar]
foreground = "#eff1f5"
background = "#6c6f85"

[colors.hints.start]
foreground = "#eff1f5"
background = "#df8e1d"

[colors.hints.end]
foreground = "#eff1f5"
background = "#6c6f85"

[colors.selection]
text = "CellForeground"
background = "#bcc0cc"

[colors.normal]
black = "#bcc0cc"
red = "#d20f39"
green = "#40a02b"
yellow = "#df8e1d"
blue = "#1e66f5"
magenta = "#ea76cb"
cyan = "#179299"
white = "#5c5f77"

[colors.bright]
black = "#acb0be"
red = "#d20f39"
green = "#40a02b"
yellow = "#df8e1d"
blue = "#1e66f5"
magenta = "#ea76cb"
cyan = "#179299"
white = "#6c6f85"

[[colors.indexed_colors]]
index = 16
color = "#fe640b"

[[colors.indexed_colors]]
index = 17
color = "#dc8a78"
