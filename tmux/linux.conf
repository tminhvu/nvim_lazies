
# Linux only: tmux (scripts/setup.lua appends this there)
# true color and undercurl (nvim's diagnostics) through tmux
set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty*:RGB,xterm*:RGB"
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'
