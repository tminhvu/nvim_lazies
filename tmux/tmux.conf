# tmux inside Alacritty: tmux windows are the tabs. scripts/setup.lua installs this as ~/.tmux.conf,
# with windows.conf (psmux, the native tmux for Windows) or linux.conf appended.

# tabs: Ctrl+Shift+T new (in the current folder), Ctrl+Shift+Q close, Alt+1..9 go to tab 1..9.
# Terminals send Ctrl+Shift+T like Ctrl+T, so Alacritty turns those two into Alt+t / Alt+q
# (lowercase: psmux doesn't tell Alt+Shift+T from Alt+t)
bind -n M-t new-window -c "#{pane_current_path}"
bind -n M-q kill-window
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# a window's tabs go when the window does (nothing left running in the background)
set -g destroy-unattached on

set -g mouse on
set -g history-limit 5000
# nvim: no delay after Esc, and focus events (autoread, etc.)
set -sg escape-time 10
set -g focus-events on

# the tab bar, on top, in catppuccin latte like nvim
set -g status-position top
set -g status-style "bg=#e6e9ef,fg=#6c6f85"
set -g status-left ""
set -g status-right ""
setw -g window-status-separator ""
setw -g window-status-format " #I #W "
setw -g window-status-current-format " #I #W "
setw -g window-status-current-style "bg=#eff1f5,fg=#1e66f5,bold"
set -g message-style "bg=#e6e9ef,fg=#4c4f69"
set -g pane-border-style "fg=#ccd0da"
set -g pane-active-border-style "fg=#1e66f5"
